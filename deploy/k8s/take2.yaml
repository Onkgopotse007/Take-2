# Everything for Take 2 lives in the take2 namespace. Nothing here touches other namespaces.
# IMAGE_TAG is replaced by deploy/deploy.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: take2
---
# Game server. Exactly one replica: tables live in its memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: take2-server
  namespace: take2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: take2-server }
  template:
    metadata:
      labels: { app: take2-server }
    spec:
      containers:
        - name: server
          image: take2-server:IMAGE_TAG
          imagePullPolicy: Never
          env:
            - { name: PORT, value: "2567" }
          ports:
            - { name: http, containerPort: 2567 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the image's "node" user
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: take2-server
  namespace: take2
spec:
  selector: { app: take2-server }
  ports:
    - { name: http, port: 2567, targetPort: http }
---
# Caddy keeps its HTTPS certificates here once there is a domain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: take2-caddy-data
  namespace: take2
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
# Web front on the VM's ports 80 and 443 (hostPort; Traefik and servicelb are disabled on this cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: take2-web
  namespace: take2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: take2-web }
  template:
    metadata:
      labels: { app: take2-web }
    spec:
      containers:
        - name: caddy
          image: take2-web:IMAGE_TAG
          imagePullPolicy: Never
          env:
            # Becomes the domain name once there is one; Caddy then serves HTTPS on 443.
            - { name: SITE_ADDRESS, value: ":80" }
            - { name: UPSTREAM, value: "take2-server.take2.svc.cluster.local:2567" }
          ports:
            - { name: http, containerPort: 80, hostPort: 80 }
            - { name: https, containerPort: 443, hostPort: 443 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: take2-caddy-data }
        - name: config
          emptyDir: {}
