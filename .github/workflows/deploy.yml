name: Deploy

# development is live: every merge is tested, built and released to the VM.
on:
  push:
    branches: [development]
  workflow_dispatch:

# One release at a time; a newer merge waits rather than racing the previous one.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/onkgopotse007/take2-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/onkgopotse007/take2-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Check the VM will be able to pull them
        run: |
          for image in take2-server take2-web; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:onkgopotse007/$image:pull" | jq -r .token)
            if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                 -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                 "https://ghcr.io/v2/onkgopotse007/$image/manifests/${{ github.sha }}"; then
              echo "::error::ghcr.io/onkgopotse007/$image is not public, so the VM cannot pull it. Make the package public in its GitHub package settings, then re-run this workflow."
              exit 1
            fi
          done

  release:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://140.238.81.209
    steps:
      - name: Release on the VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes take2-deploy@140.238.81.209 "release ${{ github.sha }}"
      - name: Check the live site
        run: |
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null http://140.238.81.209/
          curl -fsS --retry 5 --retry-delay 3 http://140.238.81.209/api/healthz
