name: CI

on:
  pull_request:
  # Merges to development run this through deploy.yml before releasing.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @take2/client build

  # Runs the real Caddyfile (with DOMAIN=localhost, so no Let's Encrypt request is made) and checks
  # who gets in on plain HTTP.
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Caddy with the Caddyfile
        run: |
          docker run -d --name caddy -p 8080:80 -e DOMAIN=localhost \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          for i in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8080/ -H 'Host: 10.42.0.9:80' && break; sleep 0.5; done
      - name: Check the domain, the bare IP and the readiness probe
        run: |
          set -x
          # The domain over plain HTTP is sent to HTTPS, keeping the path.
          [[ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: localhost' http://127.0.0.1:8080/K7MPX)" =~ ^30[18]\ https://localhost/K7MPX$ ]]
          # The bare IP gets nothing.
          if curl -s -H 'Host: 140.238.81.209' http://127.0.0.1:8080/; then echo 'The bare IP still answers'; exit 1; fi
          # Kubernetes' probe, addressed to the pod IP, is answered.
          test "$(curl -s -H 'Host: 10.42.0.9:80' http://127.0.0.1:8080/)" = ok
      - if: failure()
        run: docker logs caddy
